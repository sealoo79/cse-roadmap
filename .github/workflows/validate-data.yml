name: validate-data
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # 외부 패키지가 없어 npm ci 없이 바로 실행한다.
      - name: 기준 데이터 검증 (data/)
        run: npm run validate-data
      - name: 검증기 자체 점검 — 잘못된 데이터는 실패해야 함
        run: |
          mkdir -p "$RUNNER_TEMP/bad-data"
          cp data/*.json "$RUNNER_TEMP/bad-data/"
          node -e "
            const fs = require('fs');
            const f = process.argv[1] + '/curriculum.json';
            const d = JSON.parse(fs.readFileSync(f, 'utf8'));
            d[0].course_code = 'ZZZZ9999';
            fs.writeFileSync(f, JSON.stringify(d));
          " "$RUNNER_TEMP/bad-data"
          if node scripts/validate-data.ts "$RUNNER_TEMP/bad-data"; then
            echo '::error::없는 과목코드가 들어간 데이터를 검증기가 통과시켰습니다.'
            exit 1
          fi
          echo '잘못된 데이터를 정상적으로 잡아냈습니다.'
